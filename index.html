<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>
    <title>Login</title>
</head>
<body>
    <main>
        <section class="login-card" aria-labelledby="titulo">
            <h1 id="titulo">Criar conta</h1>
            <p class="subtitulo">Preencha os campos para continuar.</p>
            <form id="formularioLogin" novalidate>
                <label for="nomeusuario">Usuário</label>
                <input type="text" name="nomeusuario" placeholder="Digite seu usuário" id="nomeusuario" minlength="3" autocomplete="username" required>

                <label for="senha">Senha</label>
                <input type="password" name="senha" placeholder="Digite sua senha" id="senha" autocomplete="new-password" required>
                <div id="forcaSenha" class="forca-senha" aria-live="polite"></div>

                <label for="confirmarsenha">Confirmar senha</label>
                <input type="password" name="confirmarsenha" placeholder="Digite a senha novamente" id="confirmarsenha" autocomplete="new-password" required>

                <div id="mensagem" class="mensagem" role="status" aria-live="polite"></div>
                <button id="btVerificar">Criar Conta</button>
            </form>
        </section>
    </main>
</body>
</html>
